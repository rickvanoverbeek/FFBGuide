<VirtualHost *:80>
    # Vervang dit met je Linode IP of domeinnaam
    ServerName YOUR_LINODE_IP

    # Optioneel: als je later een domein hebt
    # ServerName ffbhub.com
    # ServerAlias www.ffbhub.com

    # Proxy naar Next.js
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket support (nodig voor hot reload in dev, en voor real-time features)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/ffbhub-error.log
    CustomLog ${APACHE_LOG_DIR}/ffbhub-access.log combined

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
